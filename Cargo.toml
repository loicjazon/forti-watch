[package]
name = "forti-watch"
description = "Affiche le temps de connexion restant du VPN FortiClient et alerte avant la fin de session"
version = "1.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/loicjazon/forti-watch"
readme = "README.md"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libappindicator = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSAlert", "NSWindow", "NSImage", "NSCell", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSTimer", "NSRunLoop", "NSDate", "NSObjCRuntime", "block2"] }
