name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Un seul run par tag à la fois (le doublon éventuel attend, puis constate que la release existe).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Compilation dans Ubuntu 22.04 : le binaire n'exige pas une glibc plus récente que celle de la
    # version minimale supportée.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Dépendances système
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git build-essential pkg-config libgtk-3-dev
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Le tag correspond à la version de Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de Cargo.toml." >&2
            exit 1
          fi
      - run: cargo build --release --locked
      - name: Binaire et empreinte SHA-256
        run: |
          mkdir dist
          cp target/release/forti-watch dist/forti-watch-linux-x86_64
          cd dist && sha256sum forti-watch-linux-x86_64 > forti-watch-linux-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  build-macos:
    runs-on: macos-latest
    env:
      # Version minimale de macOS exigée par le binaire.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust (Intel et Apple Silicon)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Le tag correspond à la version de Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de Cargo.toml." >&2
            exit 1
          fi
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Binaire universel et empreinte SHA-256
        # Signature ad hoc : macOS refuse d'exécuter du code arm64 non signé.
        run: |
          mkdir dist
          lipo -create -output dist/forti-watch-macos-universal \
            target/x86_64-apple-darwin/release/forti-watch \
            target/aarch64-apple-darwin/release/forti-watch
          codesign --force --sign - dist/forti-watch-macos-universal
          lipo -info dist/forti-watch-macos-universal
          cd dist && shasum -a 256 forti-watch-macos-universal > forti-watch-macos-universal.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/

  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent : GitHub peut lancer deux fois le workflow pour un même tag (constaté sur v1.0.0) ;
        # si la release existe déjà, on se contente de (ré)envoyer les fichiers.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
